<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- Cloudbase: a happy flat-bottomed cloud, and a little glider climbing up to it. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58B4F5"/>
      <stop offset="1" stop-color="#1E7FE0"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" rx="24" fill="url(#sky)"/>
  <!-- cloud: three puffs on a flat base -->
  <g fill="#FFFFFF">
    <circle cx="41" cy="42" r="9"/>
    <circle cx="54" cy="36" r="12"/>
    <circle cx="67" cy="41" r="10"/>
    <rect x="32" y="40" width="45" height="11" rx="3"/>
  </g>
  <!-- face -->
  <circle cx="48.5" cy="41" r="1.7" fill="#17406F"/>
  <circle cx="59.5" cy="41" r="1.7" fill="#17406F"/>
  <path d="M50.5,45 Q54,48.2 57.5,45" fill="none" stroke="#17406F" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="44.6" cy="44.6" r="2" fill="#FFB3A7" opacity="0.8"/>
  <circle cx="63.4" cy="44.6" r="2" fill="#FFB3A7" opacity="0.8"/>
  <!-- glider -->
  <path d="M41,69 L54,82 L67,69 M48.5,66.6 L54,82 L59.5,66.6" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
  <path d="M38,70 C42,58 66,58 70,70 C62,64.5 46,64.5 38,70 Z" fill="#FF8A3D"/>
  <path d="M46.5,63.2 C51,61.6 57,61.6 61.5,63.2" fill="none" stroke="#FFD08A" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="54" cy="83" r="2.8" fill="#FFFFFF"/>
</svg>
